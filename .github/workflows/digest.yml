name: SmartClock manager digests

# Triggers the 9:30 AM / 6:00 PM manager digests.
#
# This lives here, not in vercel.json, because Vercel Cron on the Hobby plan
# won't run sub-daily schedules (it caps at 2 jobs, once per day).
#
# THIS SWEEPS, IT DOES NOT FIRE ONCE PER SLOT. The previous version fired at
# exactly the four candidate UTC times and trusted GitHub to be punctual. It is
# not: on 2026-07-21 the four runs were 44, 56, 89 and 112 minutes late, every
# one landed outside the handler's narrow window, and the day's digests were
# silently dropped behind four green checkmarks.
#
# So: fire every 30 minutes across both candidate windows and let the handler
# decide. src/app/api/cron/digest/route.ts checks the real America/Toronto
# clock (DST-proof) and claims the slot in the digest_sends table before
# sending, so of the many fires in a window exactly ONE sends and the rest
# return {"skipped": "already sent"} without touching Supabase or a provider.
# Extra fires are cheap; a missed digest is not.

on:
  schedule:
    # Morning: 9:30 AM Toronto is 13:30 UTC (EDT) or 14:30 UTC (EST). Sweeping
    # 13:00-16:30 UTC covers both plus ~3h of GitHub lag.
    - cron: '0,30 13-16 * * *'
    # Evening: 6:00 PM Toronto is 22:00 UTC (EDT) or 23:00 UTC (EST). Sweeping
    # 22:00-01:30 UTC covers both; the handler stops at Toronto midnight so the
    # post-midnight UTC fires cannot bleed into the next dateKey.
    - cron: '0,30 22-23 * * *'
    - cron: '0,30 0-1 * * *'
  workflow_dispatch:
    inputs:
      force_kind:
        description: 'Force-send this digest now, ignoring the clock'
        required: false
        default: 'none'
        type: choice
        options: [none, morning, evening]
      dry_run:
        description: 'Preview only — build the digest but do NOT send'
        required: false
        default: false
        type: boolean

# Never let two runs overlap (e.g. a delayed schedule meeting a manual run).
concurrency:
  group: smartclock-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_KIND: ${{ github.event.inputs.force_kind }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repo secret is not set — add it under Settings > Secrets and variables > Actions"
            exit 1
          fi

          BASE="https://dnrapp.vercel.app/api/cron/digest"

          QS=""
          add() { if [ -z "$QS" ]; then QS="$1"; else QS="$QS&$1"; fi; }

          # Manual force-send (empty on scheduled runs).
          if [ -n "${FORCE_KIND:-}" ] && [ "$FORCE_KIND" != "none" ]; then
            add "force=1"; add "kind=$FORCE_KIND"
          fi

          # Preview without sending. dryRun only builds for a real/forced slot,
          # so pair it with force so a preview works at any time of day.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            add "dryRun=1"
            if [ -z "${FORCE_KIND:-}" ] || [ "$FORCE_KIND" = "none" ]; then
              add "force=1"; add "kind=morning"
            fi
          fi

          URL="$BASE"
          [ -n "$QS" ] && URL="$BASE?$QS"

          echo "GET $URL"
          code=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$URL")

          echo "HTTP $code"
          echo "--- response ---"
          cat response.json || true
          echo

          if [ "$code" -ge 400 ]; then
            echo "::error::Digest endpoint returned HTTP $code"
            exit 1
          fi
